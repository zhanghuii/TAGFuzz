    metadata: {d_min: 8, internal_conditions: 4, component: "noder"}
    activation_graph:
      nodes:
        - id: c_generic_func
          kind: requirement
          description: "program declares and calls a generic function"
          rule: {all_features: ["type:generic_func"]}
          guidance: "Create a generic helper and call it with concrete type arguments."
        - id: i_dictionary_needed
          kind: condition
          description: "instantiation requires generic function dictionary data"
          rule: {all_features: ["type:generic_func", "phase:types2_likely"]}
        - id: a_reader_func_inst
          kind: callsite
          description: "reader reaches funcInst callsite"
          source: {file: "cmd/compile/internal/noder/reader.go", start_line: 1, end_line: 4000}
        - id: t_target
          kind: target
          description: "reader.funcInst executes"
          source: {file: "cmd/compile/internal/noder/reader.go", start_line: 1, end_line: 4000}
      edges:
        - {from: c_generic_func, to: i_dictionary_needed}
        - {from: i_dictionary_needed, to: a_reader_func_inst}
        - {from: a_reader_func_inst, to: t_target}

  - id: ssagen_dynamic_dottype
