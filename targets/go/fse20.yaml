targets:
  - id: checker_instantiated_type
    name: "(*Checker).instantiatedType"
    language: go
    source: {file: "cmd/compile/internal/types2/typexpr.go", start_line: 1, end_line: 900}
    requirement: "Instantiate a generic named type such as Box[int]."
    metadata: {d_min: 12, internal_conditions: 1, component: "types2"}
    activation_graph:
      nodes:
        - id: c_generic_named_type
          kind: requirement
          description: "program declares and instantiates a generic named type"
          rule: {all_features: ["type:generic_type"], source_regex: "\\[[^\\]]+\\]"}
          guidance: "Declare a parameterized type and instantiate it with concrete type arguments."
        - id: i_instantiation
          kind: condition
          description: "frontend observes a generic type instantiation"
          rule: {all_features: ["type:generic_type", "phase:types2_likely"]}
        - id: t_target
          kind: target
          description: "Checker.instantiatedType executes"
          source: {file: "cmd/compile/internal/types2/typexpr.go", start_line: 1, end_line: 900}
      edges:
        - {from: c_generic_named_type, to: i_instantiation}
        - {from: i_instantiation, to: t_target}

  - id: reader_func_inst
    name: "(*reader).funcInst"
    language: go
    source: {file: "cmd/compile/internal/noder/reader.go", start_line: 1, end_line: 4000}
